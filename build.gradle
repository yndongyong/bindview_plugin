plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.0.0'
    id 'org.jetbrains.intellij.platform' version '2.7.1'
}

group 'com.yndongyong.van'
version '1.0.0'

repositories {
    maven {
        url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
    }
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

kotlin {
    jvmToolchain(17)
}

tasks.runIde {
    jvmArgs = ["-Xmx4096m", "-XX:+UnlockDiagnosticVMOptions"]
}

dependencies {
    intellijPlatform {
        bundledPlugin("org.jetbrains.android")
        bundledPlugin("com.intellij.java")
        bundledPlugin("org.jetbrains.kotlin")

        instrumentationTools()
        if (project.hasProperty("StudioRunPath")) {
            local(property("StudioRunPath").toString())
        } else {
            androidStudio(property("ideVersion").toString())
            bundledPlugin("org.jetbrains.android")
        }
    }
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
}

intellijPlatform {
    pluginConfiguration {
        ideaVersion.sinceBuild = "211"
        ideaVersion.untilBuild = ""
        changeNotes = '''
        <b>1.0.0</b><br>
        <ul>
            <li>支持通过 bindview 语法自动生成 Kotlin 属性委托视图绑定代码；</li>
            <li>支持 Local Variable (findViewById) 局部变量模式及动态 Receiver 前缀与常用预设；</li>
            <li>支持自定义宿主项目导包路径（默认 com.yndongyong.van.bindView）；</li>
            <li>优化交互：Insert Code 仅在类属性模式下展示，Local Variable 模式下自动隐藏并以 Copy Code 作为默认主按钮；</li>
            <li>插入代码块自动保持上下空行与缩进对齐。</li>
        </ul>
        '''
    }
}

// 非常重要，不然 buildPlugin 会可能失败
buildSearchableOptions {
    enabled = false
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}
